# nixpacks.toml — Coolify/Nixpacks deployment configuration for AgencyOS
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[variables]
PORT = "3000"
HOST = "0.0.0.0"
NIXPACKS_PORT = "3000"
NIXPACKS_HOST = "0.0.0.0"
NODE_ENV = "production"
NODE_OPTIONS = "--max-old-space-size=4096"

[start]
cmd = "node server.js"
