server {
    # Dual-port listen ensures instant compatibility whether Coolify routes to port 80 or 3000
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Health Check Endpoints (For Coolify, Docker, and upstream monitor readiness)
    location ~ ^/(health|healthz|api/health|ping)$ {
        default_type application/json;
        return 200 '{"status":"healthy","service":"agency-os","server":"nginx","timestamp":"$time_iso8601"}';
    }

    # SPA Routing / Rewrite logic (Prevents 404 on page refreshes and direct URL access)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-term aggressive static asset caching for built files
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
